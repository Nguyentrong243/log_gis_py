{% extends 'core/base.html' %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card bg-dark border-warning shadow-lg">
        <div class="card-header bg-warning text-dark text-center">
          <h4 class="mb-0"><i class="fas fa-plus me-2"></i>Create New Order</h4>
        </div>
        <div class="card-body p-4">
          <form method="post" id="orderForm">
            {% csrf_token %}

            <div class="mb-3">
              <label
                for="{{ form.code.id_for_label }}"
                class="form-label text-dark fw-bold"
              >
                <i class="fas fa-hashtag me-1"></i>Order Code
              </label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="{{ form.code.id_for_label }}"
                name="{{ form.code.name }}"
                value="{{ form.code.value|default:'' }}"
                placeholder="Enter order code (e.g., A001)"
                required
              />
            </div>

            <div class="mb-3">
              <label
                for="{{ form.customer_name.id_for_label }}"
                class="form-label text-dark fw-bold"
              >
                <i class="fas fa-user me-1"></i>Customer Name
              </label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="{{ form.customer_name.id_for_label }}"
                name="{{ form.customer_name.name }}"
                value="{{ form.customer_name.value|default:'' }}"
                placeholder="Enter customer name"
                required
              />
            </div>

            <div class="mb-3">
              <label
                for="{{ form.customer_address.id_for_label }}"
                class="form-label text-dark fw-bold"
              >
                <i class="fas fa-map-marker-alt me-1"></i>Customer Address
              </label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="{{ form.customer_address.id_for_label }}"
                name="{{ form.customer_address.name }}"
                value="{{ form.customer_address.value|default:'' }}"
                placeholder="Nhập địa chỉ nhận hàng"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label text-dark fw-bold">
                <i class="fas fa-map-marker-alt me-1"></i>Delivery Location
              </label>
              <p class="text-muted small">
                Click on the map below to set the delivery location
              </p>
              <button type="button" class="btn btn-sm btn-info mb-2" id="locateBtn">
                <i class="fas fa-location-arrow"></i> Lấy vị trí hiện tại
              </button>
              <div
                id="map"
                style="height: 300px; border-radius: 10px"
                class="shadow-sm"
              ></div>
              {{ form.lat }} {{ form.lng }}
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-warning btn-lg hover-scale" id="createOrderBtn">
                <span class="btn-text"><i class="fas fa-paper-plane me-2"></i>Create Order</span>
                <span class="btn-loading d-none"><i class="fas fa-spinner fa-spin me-2"></i>Creating Order...</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="{% static 'js/map.js' %}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Handle form submission loading state
    const form = document.getElementById('orderForm');
    const createOrderBtn = document.getElementById('createOrderBtn');
    const btnText = createOrderBtn.querySelector('.btn-text');
    const btnLoading = createOrderBtn.querySelector('.btn-loading');

    form.addEventListener('submit', function() {
      createOrderBtn.disabled = true;
      btnText.classList.add('d-none');
      btnLoading.classList.remove('d-none');
    });

    const locateBtn = document.getElementById('locateBtn');
    if (locateBtn) {
      locateBtn.addEventListener('click', function () {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              if (document.getElementById('id_lat')) {
                document.getElementById('id_lat').value = lat;
              }
              if (document.getElementById('id_lng')) {
                document.getElementById('id_lng').value = lng;
              }
              // Refresh map marker if map.js is loaded
              if (window.map) {
                window.map.setView([lat, lng], 14);
              }
              alert('Vị trí hiện tại đã được gán vào đơn hàng (lat: ' + lat.toFixed(6) + ', lng: ' + lng.toFixed(6) + ').');
            },
            function () {
              alert('Không thể lấy vị trí hiện tại. Vui lòng bật định vị.');
            }
          );
        } else {
          alert('Trình duyệt không hỗ trợ định vị.');
        }
      });
    }
  });
</script>
{% endblock %}
